<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — Food Construct</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-wrapper">
        <form class="login-form" action="https://httpbin.org/post" method="POST">

            <h2>Вход в аккаунт</h2>

            <label for="login">Логин:</label>
            <input type="text" id="login" name="login" placeholder="Ваш логин" required>

            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" placeholder="Ваш пароль" required>

            <label class="checkbox-label">
                <input type="checkbox" name="remember">
                Запомнить меня
            </label>

            <button type="submit">Войти</button>

            <p class="back-link"><a href="index.html">← Вернуться на главную</a></p>

        </form>
    </div>

</body>
</html>
