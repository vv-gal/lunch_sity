<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обратная связь — Food Construct</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Food Construct</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="feedback.html">Обратная связь</a>
            <a href="login.html">Войти</a>
            <a href="#contacts">Контакты</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>Обратная связь</h2>
            
            <form action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">

                <label for="fio">ФИО:</label>
                <input type="text" id="fio" name="fio" placeholder="Иванов Иван Иванович" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.ru" required>

                <p class="form-label">Откуда узнали о нас?</p>
                <div class="radio-group">
                    <label><input type="radio" name="source" value="Реклама" checked> Реклама</label>
                    <label><input type="radio" name="source" value="Друзья"> Друзья</label>
                    <label><input type="radio" name="source" value="Интернет"> Интернет</label>
                </div>

                <label for="type">Тип обращения:</label>
                <select id="type" name="type">
                    <option value="Жалоба">Жалоба</option>
                    <option value="Предложение">Предложение</option>
                </select>

                <label for="message">Текст сообщения:</label>
                <textarea id="message" name="message" rows="6" placeholder="Ваше сообщение..."></textarea>

                <label for="file">Вложения:</label>
                <input type="file" id="file" name="file">

                <label class="checkbox-label">
                    <input type="checkbox" name="agree" required>
                    Даю согласие на обработку персональных данных
                </label>

                <button type="submit">Отправить</button>

            </form>
        </section>
    </main>

    <footer id="contacts">
        <p>Позвонить нам <a href="tel:+70000000000">+7-000-000-00-00</a></p>
    </footer>

</body>
</html>
