<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собрать ланч — Food Construct</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="lunch.css">
    <link rel="stylesheet" href="print.css" media="print">
</head>
<body>

    <header>
        <h1>Food Construct</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="lunch.html" class="active">Собрать ланч</a>
            <a href="feedback.html">Обратная связь</a>
            <a href="login.html">Войти</a>
        </nav>
    </header>

    <main>
        <!-- Секция с меню -->
        <section class="menu-section">
            <h2>Первые блюда</h2>
            <div class="dishes-grid" id="soups"></div>

            <h2>Главные блюда</h2>
            <div class="dishes-grid" id="mains"></div>

            <h2>Напитки</h2>
            <div class="dishes-grid" id="drinks"></div>
        </section>

        <!-- Форма заказа -->
        <section class="order-section">
            <h2>Сделать заказ</h2>
            <form action="https://httpbin.org/post" method="POST" class="order-form" id="order-form">
                <div class="form-columns">
                    <!-- Левая колонка -->
                    <div class="form-col">
                        <h3>Ваш заказ</h3>

                        <div class="order-list" id="order-list">
                            <p class="empty-order">Ничего не выбрано</p>
                        </div>

                        <div class="order-total" id="order-total"></div>

                        <label for="comment">Комментарии к заказу</label>
                        <textarea id="comment" name="comment" rows="4"></textarea>
                    </div>

                    <!-- Правая колонка -->
                    <div class="form-col">
                        <h3>Ваши данные</h3>

                        <label for="name">Имя</label>
                        <input type="text" id="name" name="name" required>

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>

                        <label class="checkbox-label">
                            <input type="checkbox" name="subscribe"> Получать информацию о скидках и акциях
                        </label>

                        <label for="phone">Номер телефона</label>
                        <input type="tel" id="phone" name="phone" required>

                        <label for="address">Адрес доставки</label>
                        <input type="text" id="address" name="address" required>
                        <small>Доставка осуществляется только по Москве</small>

                        <div class="radio-group">
                            <p>Время доставки:</p>
                            <label><input type="radio" name="time" value="asap" checked> Как можно скорее</label>
                            <label><input type="radio" name="time" value="exact"> К указанному времени</label>
                        </div>

                        <label for="time-input">Укажите время доставки</label>
                        <input type="time" id="time-input" name="time-input">
                        <small>Доступное время доставки с 7:00 до 23:00</small>

                        <div class="form-buttons">
                            <button type="reset" class="btn-reset">Сбросить</button>
                            <button type="submit" class="btn-submit">Отправить</button>
                        </div>
                    </div>
                </div>
            </form>
        </section>

    </main>

    <footer id="contacts">
        <p>Позвонить нам <a href="tel:+70000000000">+7-000-000-00-00</a></p>
    </footer>

    <!-- Подключаем скрипты -->
    <script src="dishes.js"></script>
    <script src="render.js"></script>
    <script src="order.js"></script>
</body>
</html>
